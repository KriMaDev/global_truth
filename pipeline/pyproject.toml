[project]
name = "globe-pipeline"
version = "0.1.0"
description = "Fetches, normalizes, geocodes, categorizes and rates world news for World News Globe."
license = "MIT"
authors = [{ name = "KriMa" }]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Homepage = "https://globe.krimadev.com"
Source = "https://github.com/KriMaDev/global_truth"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "SIM", "RUF"]
# RUF001: feeds use typographic dashes, curly quotes and non-Latin letters on purpose.
# SIM905: a word list written as one split string reads better than a long list literal.
ignore = ["RUF001", "SIM905"]
