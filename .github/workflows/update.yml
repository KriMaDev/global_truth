name: Update data and deploy

# Run the pipeline, build the site with the fresh data, deploy to Cloudflare. Switched off
# until the repository variable LIVE is "true" (Settings -> Secrets and variables -> Actions ->
# Variables), so nothing goes public by accident.
#
# What starts it: a Cloudflare Cron Trigger at minutes 7 and 37 (the separate timer Worker in
# worker/ sends a workflow_dispatch), because GitHub's own scheduler often starts runs late or
# not at all. GitHub's schedule below is only a backup in case the timer fails: it runs every
# 3 hours and stops early when the data on the site is fresh anyway.
#
# Security: the job that runs the pipeline and installs packages has no secrets. Only the deploy
# job can read the Cloudflare token: it runs on main only (environment `production`), and the
# token is limited to the one Worker `world-news-globe`. It uploads a new version instead of
# using `wrangler deploy`, which would also need permission to change routes and timers.

on:
  schedule:
    - cron: '52 */3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Never two runs at once: each run builds on the data the previous one published.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # The backup schedule only runs the update when the live data is 40 minutes old or more
  # (or can't be read). Runs started by the timer or by hand always go ahead.
  check:
    if: vars.LIVE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - name: How old is the live data?
        id: age
        env:
          EVENT: ${{ github.event_name }}
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timezone

          run = "true"
          if os.environ["EVENT"] == "schedule":
              try:
                  request = urllib.request.Request(
                      "https://globe.krimadev.com/data/feeds.json",
                      headers={"User-Agent": "world-news-globe-update-check"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      generated = json.load(response)["generated"]
                  moment = datetime.fromisoformat(generated.replace("Z", "+00:00"))
                  minutes = (datetime.now(timezone.utc) - moment).total_seconds() / 60
                  print(f"Live data is {minutes:.0f} minutes old.")
                  if minutes < 40:
                      run = "false"
                      print("Fresh enough: the timer is working, so this backup run stops.")
              except Exception as error:
                  print(f"Couldn't read the live data ({error}); updating.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={run}\n")

  build:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Month (the gazetteer is rebuilt monthly)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Gazetteer cache
        id: gazetteer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/gazetteer
          key: gazetteer-${{ steps.month.outputs.month }}-${{ hashFiles('pipeline/globe_pipeline/data/m49.csv', 'pipeline/tools/build_gazetteer.py') }}

      - name: Build the gazetteer (GeoNames, once a month)
        if: steps.gazetteer.outputs.cache-hit != 'true'
        run: python pipeline/tools/build_gazetteer.py

      - name: Run the pipeline
        working-directory: pipeline
        run: python -m globe_pipeline.run --out ../frontend/public/data

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Keep the built site for the deploy job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: frontend/dist
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # Only wrangler is used from here on; install scripts of other packages don't run.
      - run: npm ci --ignore-scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: frontend/dist

      - name: Deploy to Cloudflare
        shell: bash
        run: |
          id="$(npx wrangler versions upload --message "Data update ${GITHUB_SHA::7}" | tee /dev/stderr | sed -n 's/^Worker Version ID: //p')"
          test -n "$id"
          npx wrangler versions deploy "$id@100%" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
