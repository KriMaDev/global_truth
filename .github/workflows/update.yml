name: Update data and deploy

# Run the pipeline, build the site with the fresh data, deploy to Cloudflare. Switched off
# until the repository variable LIVE is "true" (Settings -> Secrets and variables -> Actions ->
# Variables), so nothing goes public by accident.
#
# What starts it: Cloudflare's Cron Trigger at minutes 7 and 37 (worker/index.js sends a
# workflow_dispatch), because GitHub's own scheduler often starts runs late or not at all.
# GitHub's schedule below is only a backup in case the timer fails: it runs every 3 hours and
# stops early when the data on the site is fresh anyway.

on:
  schedule:
    - cron: "52 */3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# Never two runs at once: each run builds on the data the previous one published.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  # The backup schedule only runs the update when the live data is 40 minutes old or more
  # (or can't be read). Runs started by the timer or by hand always go ahead.
  check:
    if: vars.LIVE == 'true' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      run: ${{ steps.age.outputs.run }}
    steps:
      - name: How old is the live data?
        id: age
        env:
          EVENT: ${{ github.event_name }}
        shell: python
        run: |
          import json, os, urllib.request
          from datetime import datetime, timezone

          run = "true"
          if os.environ["EVENT"] == "schedule":
              try:
                  request = urllib.request.Request(
                      "https://globe.krimadev.com/data/feeds.json",
                      headers={"User-Agent": "world-news-globe-update-check"},
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      generated = json.load(response)["generated"]
                  moment = datetime.fromisoformat(generated.replace("Z", "+00:00"))
                  minutes = (datetime.now(timezone.utc) - moment).total_seconds() / 60
                  print(f"Live data is {minutes:.0f} minutes old.")
                  if minutes < 40:
                      run = "false"
                      print("Fresh enough: the timer is working, so this backup run stops.")
              except Exception as error:
                  print(f"Couldn't read the live data ({error}); updating.")
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"run={run}\n")

  update:
    needs: check
    if: needs.check.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"

      - name: Month (the gazetteer is rebuilt monthly)
        id: month
        run: echo "month=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Gazetteer cache
        id: gazetteer
        uses: actions/cache@v6.1.0
        with:
          path: .cache/gazetteer
          key: gazetteer-${{ steps.month.outputs.month }}-${{ hashFiles('pipeline/globe_pipeline/data/m49.csv', 'pipeline/tools/build_gazetteer.py') }}

      - name: Build the gazetteer (GeoNames, once a month)
        if: steps.gazetteer.outputs.cache-hit != 'true'
        run: python pipeline/tools/build_gazetteer.py

      - name: Run the pipeline
        working-directory: pipeline
        run: python -m globe_pipeline.run --out ../frontend/public/data

      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Deploy to Cloudflare
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
